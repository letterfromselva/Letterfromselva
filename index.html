
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Content</title>

<style>
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: white;
  color: black;
  font-family: Arial, sans-serif;
}

body {
  display: grid;
  place-items: center;
  font-size: 32px;
}

#content {
  user-select: none;
  -webkit-user-select: none;
}
</style>
</head>

<body>

<div id="content"></div>

<script>
const SUPABASE_URL =
"https://zbbngqjmpaziwhmvisug.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiYm5ncWptcGF6aXdobXZpc3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNjAzMzgsImV4cCI6MjExMDkzNjMzOH0.QNFJr6TzcDjvhEQTP12ekek98yioGFavR21dUdNSIek";

const contentBox = document.getElementById("content");

document.addEventListener("contextmenu", e => {
  e.preventDefault();
});

["copy", "cut", "paste", "selectstart", "dragstart"]
.forEach(event => {
  document.addEventListener(event, e => {
    e.preventDefault();
  });
});

document.addEventListener("keydown", e => {
  if (
    (e.ctrlKey || e.metaKey) &&
    ["c", "x", "v", "s", "p", "a", "u"].includes(e.key.toLowerCase())
  ) {
    e.preventDefault();
  }
});

async function loadContent() {
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/claim_one_time_content",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: "{}",
        cache: "no-store"
      }
    );

    if (!response.ok) return;

    const data = await response.json();

    if (data && data.success === true) {
      contentBox.textContent = data.content;
    }

  } catch (error) {
    contentBox.textContent = "";
  }
}

loadContent();
</script>

</body>
</html>
